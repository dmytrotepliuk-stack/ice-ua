name: Daily hockey statistics refresh
on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch NHL statistics
        env:
          HOCKEY_SEASON: '20262027'
        run: node scripts/sync.mjs
      - name: Commit updated data
        run: |
          git add data/players.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh hockey statistics'
            git push
          fi
