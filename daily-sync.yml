name: Daily hockey statistics refresh
on:
  schedule:
    - cron: '15 6 * * *' # UTC; GitHub scheduled workflows may be delayed
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update licensed statistics feed
        env:
          STATISTICS_FEED_URL: ${{ secrets.STATISTICS_FEED_URL }}
          STATISTICS_FEED_TOKEN: ${{ secrets.STATISTICS_FEED_TOKEN }}
        run: node scripts/sync.mjs
      - name: Commit changes when present
        run: |
          git add data/players.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update hockey statistics'
            git push
          fi
